[project]
name = "incidentiq-ml"
version = "0.1.0"
description = "Offline training pipeline for IncidentIQ incident-category classification"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<2.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
