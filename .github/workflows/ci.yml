name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ml-tests:
    name: ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install ml package
        working-directory: ml
        run: |
          uv venv --python 3.10
          uv pip install -e ".[dev]"
      - name: Run ml tests
        working-directory: ml
        run: uv run pytest -q

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The backend needs the trained artifact to load. CI has no access to
      # anything gitignored, so it's produced here the same explicit,
      # reproducible way as local dev (ml/README.md) — never trained
      # implicitly by the backend itself.
      - name: Prepare the model artifact
        working-directory: ml
        run: |
          uv venv --python 3.10
          uv pip install -e ".[dev]"
          uv run python scripts/generate_dataset.py
          uv run python scripts/train.py
      - name: Install backend package
        working-directory: backend
        run: |
          uv venv --python 3.10
          uv pip install -e ".[dev]"
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -q

  frontend-checks:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build (also runs TypeScript checking)
        working-directory: frontend
        run: npm run build

  e2e-tests:
    name: End-to-end tests (real backend, real model, real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare the model artifact
        working-directory: ml
        run: |
          uv venv --python 3.10
          uv pip install -e ".[dev]"
          uv run python scripts/generate_dataset.py
          uv run python scripts/train.py
      - name: Install backend package
        working-directory: backend
        run: |
          uv venv --python 3.10
          uv pip install -e ".[dev]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
