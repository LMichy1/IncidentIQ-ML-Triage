[project]
name = "incidentiq-backend"
version = "0.1.0"
description = "FastAPI inference + persistence service for IncidentIQ"
requires-python = ">=3.10"
dependencies = [
    "incidentiq-ml",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
incidentiq-ml = { path = "../ml", editable = true }
